name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: omni-crm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - uses: actions/checkout@v4
        with:
          path: omni_crm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch version-15 ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Cài app crm (cùng nhánh version-15) và omni_crm
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app crm --branch main https://github.com/frappe/crm
          bench get-app omni_crm "${GITHUB_WORKSPACE}/omni_crm"
          bench setup requirements --dev
          bench new-site test_site --db-root-password root --admin-password admin --install-app crm
          bench --site test_site install-app omni_crm
          bench --site test_site set-config allow_tests true

      - name: Chạy test omni_crm
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app omni_crm
